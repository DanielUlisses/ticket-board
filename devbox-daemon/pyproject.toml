[project]
name = "devbox-daemon"
version = "0.1.0"
description = "tk-hub devbox daemon: exports this box's boards to the hub and runs its RPCs"
requires-python = ">=3.12"
# Runtime dependencies are limited to websockets (board.md, Shape).
dependencies = [
    "websockets>=17",
]

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
